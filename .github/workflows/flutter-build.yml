# Builds unsigned iOS artifacts for local Sideloadly signing.
name: Flutter Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
          - all

env:
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: Build Android
    if: github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: "true"

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "APP_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Using app version: $VERSION"

      - name: Setup Android signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/anerycoft.jks
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../anerycoft.jks" >> android/key.properties

      - name: Build Android APK (split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          cd build/app/outputs/flutter-apk
          for file in app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's/app-(.*)-release\.apk/\1/')
            mv "$file" "CourseHelper_${VERSION}_${abi}.apk"
          done
          ls -l

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/CourseHelper_*.apk   # 匹配重命名后的文件
          if-no-files-found: error

  build-ios:
    name: Build unsigned iOS IPA
    if: github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: "true"

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using app version: $VERSION"

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package and verify unsigned IPA
        run: |
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/ipa"
          IPA_PATH="$IPA_DIR/CourseHelper_${VERSION}_unsigned.ipa"

          test -d "$APP_PATH"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          ditto "$APP_PATH" "$IPA_DIR/Payload/Runner.app"
          (
            cd "$IPA_DIR"
            /usr/bin/zip -qry "$(basename "$IPA_PATH")" Payload
            /usr/bin/unzip -l "$(basename "$IPA_PATH")" | grep -q 'Payload/Runner.app/'
          )
          ls -lh "$IPA_PATH"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/CourseHelper_*_unsigned.ipa
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Get version from tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Get tag message
        id: tag_message
        run: |
          git fetch --tags --force
          TAG=${{ steps.get_version.outputs.VERSION }}
          TAG_MSG=$(git for-each-ref refs/tags/$TAG --format='%(contents)')
          echo "TAG_MSG<<EOF" >> $GITHUB_ENV
          echo "$TAG_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/android-apk/*.apk
            release-assets/ios-ipa/CourseHelper_*_unsigned.ipa
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ env.TAG_MSG }}
          update_release: true
